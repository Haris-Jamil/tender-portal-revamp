<div *ngIf="filters.length" style="line-height: 2.5;">
    <strong style="margin-right:10px" >Applied Filters:</strong>
    <span class="pill" *ngFor="let filter of filters" >
        <span class="pillTitle" >{{format(filter.name)}}:</span>
        <span class="innerPill"  *ngFor="let f of filter.data" >{{f}} 
            <span class="cross" (click)="removeFilter(filter.name, f)" >
                <fa-icon [icon]="crossIcon"></fa-icon>
            </span>
        </span>
    </span>
    <hr>
</div>
