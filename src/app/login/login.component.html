<div class="loginContainer" >
            
    <div class="formContainer" >

        <div class="loginHeader" >
            <h4>Sing In</h4>
        </div>
        <input class="form-control" [(ngModel)]="username"  type="text" placeholder="username" />
        <input class="form-control" [(ngModel)]="password" type="password" placeholder="password" />        
        <button class="btn btn-primary btn-sm loginBtn" (click)="login()" >login</button>
        <p class="errorMsg" *ngIf="errorMsg" >{{errorMsg}}</p>
        <p class="registerLink" >haven't registered yet? <a routerLink="/register">Register now</a></p>
    </div>

</div>
