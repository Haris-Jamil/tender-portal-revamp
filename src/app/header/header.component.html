        <div class="btn-group" style="margin-right: 20px;">
            <button type="button" class="btn btn-primary">Hello, {{username}}</button>
            <button type="button" class="btn btn-primary dropdown-toggle-split" data-bs-toggle="dropdown" aria-expanded="false">
                <fa-icon [icon]="faUserCircle" size="1x" class="userIcon" ></fa-icon>
            </button>
            <ul class="dropdown-menu">
              <li *ngIf="isAdmin" ><a class="dropdown-item" (click)="goto('dashboard')" href="javascript:void(0)">Dashboard</a></li>
              <li *ngIf="isStrayUser" ><a (click)="showPopup()" class="dropdown-item" href="javascript:void(0)">Unlock full content</a></li>
              <li><a (click)="showPaymentPopup()" class="dropdown-item" href="javascript:void(0)">Paymeny Method</a></li>
              <li><a class="dropdown-item" (click)="logout()" href="javascript:void(0)">Logout</a></li>
            </ul>
        </div>
    </div>

    <div class="userDetailContainer" *ngIf="showBtn" >
        <button class="btn btn-primary btn-sm my-btn" (click)="goto('login')" >Login</button>
        <button class="btn btn-primary btn-sm my-btn" (click)="goto('register')" >Register</button>
