<div class="headerContainer" >
    <div class="logoContainer" >
        <h3 class="logo" >HAL Tenders</h3>
    </div>

    <!-- <div class="searchbarContainer" >
        <input class="searchbar" placeholder="Search tenders by title..." />
    </div> -->

    <div class="userDetailContainer" *ngIf="!showBtn" >
        <div class="userNameContainer">
            <span class="userName">Hello, {{username}}</span>            
        </div>
        <div class="userIconContainer" >
            <fa-icon [icon]="faUserCircle" size="2x" class="userIcon" ></fa-icon>
        </div>
        <button class="btn btn-primary btn-sm" (click)="logout()" >Logout</button>
    </div>

    <div class="userDetailContainer" *ngIf="showBtn" >
        <button class="btn btn-primary btn-sm" (click)="goto('login')" >Login</button>
        <button class="btn btn-primary btn-sm" (click)="goto('register')" >Register</button>
    </div>
</div>
