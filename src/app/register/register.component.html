<div class="loginContainer" >
            
    <div class="formContainer" >

        <div class="loginHeader" >
            <h4>Register</h4>
        </div>
        <input class="form-control" [(ngModel)]="username" type="text" placeholder="username" />
        <input class="form-control" [(ngModel)]="password" type="password" placeholder="password" />
        <input class="form-control" [(ngModel)]="confirmPassword" type="password" placeholder="confirm password" />
        <span class="errorMsg" *ngIf="errorMsg" >{{errorMsg}}</span>
        <button class="btn btn-primary btn-sm loginBtn" (click)="register()" >Register</button>
    </div>

</div>
