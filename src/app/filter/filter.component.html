<div class="filterTitle" (click)="toggleFilterSection($event)" >
    <span>Tender Title</span> 
    <fa-icon [icon]="faCaretDown"></fa-icon>
</div>
<div class="filterSection">
    <input id="title" type="text" class="input-control" [(ngModel)]="filterObj.title" />
</div>               

<div class="filterTitle" (click)="toggleFilterSection($event)" >
    <span>Tender #</span> 
    <fa-icon [icon]="faCaretDown"></fa-icon>
</div>
<div class="filterSection">
    <input id="tenderNo" type="text" class="input-control" [(ngModel)]="filterObj.tenderNo" />
</div>               

<div class="filterTitle" (click)="toggleFilterSection($event)">
    <span>Location</span>
    <fa-icon [icon]="faCaretDown"></fa-icon>
</div>
<div class="filterSection">
    <!-- <input type="text" class="input-control" [(ngModel)]="filterObj.location" /> -->
    <ng-container *ngFor="let city of cities" >
        <label><input type="checkbox" (click)="setCheckbox($event, 'location')" name="location" value="{{city}}" /> {{city}} </label><br/>
    </ng-container>    
    <input style="width:250px" [(ngModel)]="cityText" type="text" class="form-control form-control-sm" placeholder="enter cities coma seperated.." >
</div>

<div class="filterTitle" (click)="toggleFilterSection($event)">
    <span>Category</span>
    <fa-icon [icon]="faCaretDown"></fa-icon>
</div>
<div class="filterSection">
    <ng-container *ngFor="let c of categories" >
        <label><input id="{{c}}" type="checkbox" (click)="setCheckbox($event, 'categories')" name="category" value="{{c}}" /> {{c}}</label><span class="count">{{getCatCount(c)}}</span><br/>                           
    </ng-container>       
</div>

<div class="filterTitle" (click)="toggleFilterSection($event)">
    <span>Agency</span>
    <fa-icon [icon]="faCaretDown"></fa-icon>
</div>
<div class="filterSection">
    <ng-container *ngFor="let comp of allCompanies" >
        <label>
            <input type="checkbox" id="{{comp}}" (click)="setCheckbox($event, 'companies')" name="company" value="{{comp}}" /> {{comp}} 
        </label>
        <span class="count">{{getCount(comp)}}</span><br/>                           
    </ng-container>    
    <input id="companyText" style="width:250px" [(ngModel)]="companyText" type="text" class="form-control form-control-sm" placeholder="company.." >
</div>

<div class="filterTitle" (click)="toggleFilterSection($event)">
    <span>Project Nature</span>
    <fa-icon [icon]="faCaretDown"></fa-icon>
</div>   
<div class="filterSection">
    <label><input id="Local" type="checkbox" (click)="setCheckbox($event, 'nature')" value="Local" /> Local</label><br/>                           
    <label><input id="National" type="checkbox" (click)="setCheckbox($event, 'nature')" value="National" /> National</label><br/>
    <label><input id="International" type="checkbox" (click)="setCheckbox($event, 'nature')" value="International" /> International</label>  
</div>

<div class="filterTitle" (click)="toggleFilterSection($event)">
    <span>Bid Security</span>
    <fa-icon [icon]="faCaretDown"></fa-icon>
</div>   
<div class="filterSection">
    <label><input id="NoBidSecurity" type="checkbox" (click)="setCheckbox($event, 'NoBidSecurity')" /> No bid security</label><br/>    
    <label><input id="WithBidSecurity" type="checkbox" (click)="setCheckbox($event, 'WithBidSecurity')" /> With bid security</label> 
</div>

<div class="filterTitle" (click)="toggleFilterSection($event)">
    <span>Published Date</span>
    <fa-icon [icon]="faCaretDown"></fa-icon>
</div>
<div class="filterSection" style="padding-right:15px" >
    <span>Start Date:</span>
    <input id="publishedDate" type="date" class="form-control" name="publishedDate" (change)="changeDate($event, 'publishedDate')" >
    <span>End Date:</span>
    <input id="publishedDateEnd" style="margin-top:5px" [disabled]="!filterObj.publishedDate" type="date" class="form-control" name="publishedDateEnd" (change)="changeDate($event, 'publishedDateEnd')" >
</div> 


<div class="filterTitle" (click)="toggleFilterSection($event)">
    <span>Closing Date</span>
    <fa-icon [icon]="faCaretDown"></fa-icon>
</div>
<div class="filterSection border-bottom" style="padding-right:15px">
    <span>Start Date:</span>
    <input id="closingDate" type="date" class="form-control" name="closingDate" (change)="changeDate($event, 'closingDate')" >
    <span>End Date:</span>
    <input id="closingDateEnd" style="margin-top:5px" [disabled]="!filterObj.closingDate" type="date" class="form-control" name="closingDateEnd" (change)="changeDate($event, 'closingDateEnd')" >
</div>

<div class="filterTitle" (click)="toggleFilterSection($event)">
    <span>Upload Date</span>
    <fa-icon [icon]="faCaretDown"></fa-icon>
</div>
<div class="filterSection border-bottom" style="padding-right:15px">
    <input id="uploadDate" type="date" class="form-control" name="uploadDate" (change)="changeDate($event, 'uploadDate')" >
</div>

<button class="btn btn-primary filterBtn btn-sm" (click)="applyFilter()" >Apply Filter</button>
