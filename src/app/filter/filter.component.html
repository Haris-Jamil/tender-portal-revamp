<div class="filterTitle" (click)="toggleFilterSection($event)" >
    <span>Tender Title</span> 
    <fa-icon [icon]="faCaretDown"></fa-icon>
</div>
<div class="filterSection">
    <input type="text" class="input-control" [(ngModel)]="filterObj.title" />
</div>               

<div class="filterTitle" (click)="toggleFilterSection($event)" >
    <span>Tender #</span> 
    <fa-icon [icon]="faCaretDown"></fa-icon>
</div>
<div class="filterSection">
    <input type="text" class="input-control" [(ngModel)]="filterObj.tenderNo" />
</div>               

<div class="filterTitle" (click)="toggleFilterSection($event)">
    <span>Location</span>
    <fa-icon [icon]="faCaretDown"></fa-icon>
</div>
<div class="filterSection">
    <input type="text" class="input-control" [(ngModel)]="filterObj.location" />
</div>

<div class="filterTitle" (click)="toggleFilterSection($event)">
    <span>Category</span>
    <fa-icon [icon]="faCaretDown"></fa-icon>
</div>
<div class="filterSection">
    <label><input type="checkbox" (click)="setCheckbox($event, 'categories')" name="category" value="HVAC" /> HVAC</label><br/>                           
    <label><input type="checkbox" (click)="setCheckbox($event, 'categories')" name="category" value="MEP" /> MEP</label><br/>
    <label><input type="checkbox" (click)="setCheckbox($event, 'categories')" name="category" value="Plumbing" /> Plumbing</label><br/>
    <label><input type="checkbox" (click)="setCheckbox($event, 'categories')" name="category" value="Electrical Works" /> Electrical Works</label><br/>
    <label><input type="checkbox" (click)="setCheckbox($event, 'categories')" name="category" value="Construction" /> Construction</label><br/>
    <label><input type="checkbox" (click)="setCheckbox($event, 'categories')" name="category" value="Consultancy Services" /> Consultancy Services</label><br/>
    <label><input type="checkbox" (click)="setCheckbox($event, 'categories')" name="category" value="Mechanical Parts" /> Mechanical Parts</label><br/>
    <label><input type="checkbox" (click)="setCheckbox($event, 'categories')" name="category" value="Electrical Parts" /> Electrical Parts</label><br/>
    <label><input type="checkbox" (click)="setCheckbox($event, 'categories')" name="category" value="IT Equipment" /> IT Equipment</label><br/>
    <label><input type="checkbox" (click)="setCheckbox($event, 'categories')" name="category" value="IT Sector" /> IT Sector</label><br/>
    <label><input type="checkbox" (click)="setCheckbox($event, 'categories')" name="category" value="Power Equipment" /> Power Equipment</label>
</div>

<div class="filterTitle" (click)="toggleFilterSection($event)">
    <span>Company</span>
    <fa-icon [icon]="faCaretDown"></fa-icon>
</div>

    <label><input type="checkbox" (click)="setCheckbox($event, 'companies')" name="company" value="OGDCL" /> OGDCL</label><br/>                           
    <label><input type="checkbox" (click)="setCheckbox($event, 'companies')" name="company" value="PAKRAIL" /> PAKRAIL</label><br/>
    <label><input type="checkbox" (click)="setCheckbox($event, 'companies')" name="company" value="PARCO" /> PARCO</label><br/>
    <label><input type="checkbox" (click)="setCheckbox($event, 'companies')" name="company" value="PPRA-PAK" /> PPRA-PAK</label><br/>
    <label><input type="checkbox" (click)="setCheckbox($event, 'companies')" name="company" value="PPRA-PUN" /> PPRA-PUN</label><br/>
    <label><input type="checkbox" (click)="setCheckbox($event, 'companies')" name="company" value="PSO" /> PSO</label><br/>
    <label><input type="checkbox" (click)="setCheckbox($event, 'companies')" name="company" value="POF" /> POF</label><br/>
    <label><input type="checkbox" (click)="setCheckbox($event, 'companies')" name="company" value="SNGPL" /> SNGPL</label><br/>
    <label><input type="checkbox" (click)="setCheckbox($event, 'companies')" name="company" value="PIA" /> PIA</label><br/>
    <label><input type="checkbox" (click)="setCheckbox($event, 'companies')" name="company" value="PPL" /> PPL</label><br/>
    <label><input type="checkbox" (click)="setCheckbox($event, 'companies')" name="company" value="MISCELLANEOUS" /> MISCELLANEOUS</label>
</div>

<div class="filterTitle" (click)="toggleFilterSection($event)">
    <span>Project Nature</span>
    <fa-icon [icon]="faCaretDown"></fa-icon>
</div>   
<div class="filterSection">
    <label><input type="checkbox" (click)="setCheckbox($event, 'nature')" value="Local" /> Local</label><br/>                           
    <label><input type="checkbox" (click)="setCheckbox($event, 'nature')" value="National" /> National</label><br/>
    <label><input type="checkbox" (click)="setCheckbox($event, 'nature')" value="International" /> International</label>  
</div>

<div class="filterTitle" (click)="toggleFilterSection($event)">
    <span>Published Date</span>
    <fa-icon [icon]="faCaretDown"></fa-icon>
</div>
<div class="filterSection" style="padding-right:15px" >
    <input type="date" class="form-control" name="publishedDate" (change)="changeDate($event, 'publishedDate')" >
</div> 


<div class="filterTitle" (click)="toggleFilterSection($event)">
    <span>Closing Date</span>
    <fa-icon [icon]="faCaretDown"></fa-icon>
</div>
<div class="filterSection border-bottom" style="padding-right:15px">
    <input type="date" class="form-control" name="closingDate" (change)="changeDate($event, 'closingDate')" >
</div> 

<button class="btn btn-primary filterBtn btn-sm" (click)="applyFilter()" >Apply Filter</button>
